<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recent Payouts — Proof of Reward Payments</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a1420;
    color: #e6edf5;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { color: #93a3b8; font-size: 14px; margin: 0 0 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #1c2b3d; }
  th { color: #93a3b8; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }
  td.amount { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #34d399; }
  td.tx { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #7fa8d9; word-break: break-all; }
  .empty, .error { color: #93a3b8; font-size: 14px; padding: 24px 0; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Recent Payouts</h1>
    <p class="sub">Live, publicly-verifiable log of the most recent completed withdrawals paid out to real users.</p>
    <div id="content"><p class="empty">Loading…</p></div>
  </div>

  <script>
    async function load() {
      var el = document.getElementById('content');
      try {
        var res = await fetch('/api/payouts/recent');
        var data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Failed to load');
        if (data.payouts.length === 0) {
          el.innerHTML = '<p class="empty">No completed payouts yet.</p>';
          return;
        }
        var rows = data.payouts.map(function (p) {
          var date = p.processed_at ? new Date(p.processed_at + 'Z').toLocaleString() : '—';
          var tx = p.tx_hash ? p.tx_hash : '—';
          return '<tr><td>' + date + '</td><td>' + p.user + '</td>' +
            '<td class="amount">$' + Number(p.amount_usd).toFixed(2) + '</td>' +
            '<td class="tx">' + tx + '</td></tr>';
        }).join('');
        el.innerHTML = '<table><thead><tr><th>Date</th><th>User</th><th>Amount</th><th>Tx Hash</th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table>';
      } catch (e) {
        el.innerHTML = '<p class="error">Could not load payouts right now.</p>';
      }
    }
    load();
  </script>
</body>
</html>
