<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Spin & Earn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Monetag SDK is now injected dynamically at runtime by
         monetag.js's initMonetag(zoneId), once App.jsx has fetched the
         admin-configured zone ID from /user/config — no static <script>
         here anymore, since a hardcoded data-zone would defeat the point
         of making the zone ID admin-editable. -->
    <!-- Adsgram SDK — blockId is passed to Adsgram.init() at call time
         (see adsgram.js), not baked into this tag, so this one CAN stay
         static; it's just the generic loader. -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
